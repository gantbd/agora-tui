[workspace]
resolver = "3"
members = ["local-client", "cli"]

[package]
name = "agora-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/agora-tui"
readme = "README.md"
publish = false
description = "Composable terminal presentation for Agora conversations"

[dependencies]
agora-client = { version = "=0.1.0", path = "../agora/client/agora-client" }
agora-protocol = { version = "=0.1.0", path = "../agora/protocol/agora-protocol" }
ratatui = { version = "=0.30.2", default-features = false }
crossterm = "=0.29.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
